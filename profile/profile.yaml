summary: >
  Senior QA Engineer and Quality Assurance Lead with 15+ years of experience delivering
  high-quality software solutions across mobile applications, web applications, backend
  systems, APIs, SaaS platforms, fintech, cybersecurity, telecommunications, and enterprise
  environments.

  Experienced in the complete software testing lifecycle including requirements analysis,
  test planning, functional testing, exploratory testing, regression testing, integration
  testing, API validation, defect management, release verification, and production
  readiness activities.

  Strong systems-thinking approach with the ability to analyze complex user workflows,
  client-server communication, authentication, integrations, data flows, and business
  processes. Experienced working in Agile/Scrum environments with cross-functional
  product, engineering, and business teams.

  Passionate about modern quality engineering practices, including Playwright automation,
  API automation, CI/CD integration, AI-assisted testing, and improving QA processes
  through automation and continuous improvement.

