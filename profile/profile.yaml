professional_strengths:
  - name: Systems Thinking
    detail: Analyze complete product workflows by understanding frontend behavior, backend services, APIs, integrations, authentication, data flows, and user journeys.
  - name: Mobile & Web Quality Focus
    detail: Experienced validating user-facing applications, backend functionality, integrations, and business-critical workflows across multiple platforms.
  - name: Strong Exploratory Testing Skills
    detail: Identify edge cases, usability issues, unexpected behaviors, and integration problems beyond standard test scenarios.
  - name: Release Ownership
    detail: Comfortable providing quality assessments, identifying risks, communicating testing status, and supporting go/no-go release decisions.
  - name: Technical Defect Analysis
    detail: Skilled in creating detailed defect reports with reproduction steps, logs, technical analysis, and business impact.
  - name: Automation Mindset
    detail: Continuously identify repetitive testing activities that can be automated and improve regression efficiency through modern automation frameworks.
  - name: AI-Enhanced QA Practices
    detail: Experience applying AI tools and LLM-based approaches to improve test design, automation development, and software quality analysis.
  - name: Collaborative Communication
    detail: Effective working with developers, product managers, business users, vendors, and distributed international teams.

