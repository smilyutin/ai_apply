    url: https://github.com/smilyutin/ui_api_bank
    description: >
      Deliberately vulnerable banking web app built as a sandbox for security
      testing practice. Playwright UI + API test suites covering the OWASP
      API Top 10 (SQL injection, broken auth/authz, XSS, CSRF) plus AI/LLM
      attack scenarios against a built-in AI chat agent. Page Object Model
      architecture, Python/Flask backend, TypeScript, Docker Compose, Allure
      reporting.
  - name: AIPerformance
    url: https://github.com/smilyutin/AIPerformance
    description: >
      Testing framework for validating LLM-generated security advice.
      DeepEval + pytest suite measuring answer relevancy, faithfulness, and
      hallucination detection, plus RAG evaluation and prompt-regression
      testing against OpenAI GPT-4o-mini, with GitHub Actions CI.

